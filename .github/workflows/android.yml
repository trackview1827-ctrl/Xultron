name: Android

on:
  push:
    branches: [app]
    tags: ["android-debug-*"]
    paths:
      - "android/**"
      - ".devcontainer/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".devcontainer/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android app
        run: ./android/gradlew -p android test lint assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xultron-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  release-debug-apk:
    name: Publish tagged debug APK
    needs: verify
    if: startsWith(github.ref, 'refs/tags/android-debug-')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: xultron-debug-${{ github.sha }}
          path: release

      - name: Create checksum
        working-directory: release
        run: sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          gh release create "$TAG" \
            release/app-debug.apk \
            release/app-debug.apk.sha256 \
            --repo "$REPOSITORY" \
            --target "$TARGET" \
            --prerelease \
            --title "Xultron debug build: $TAG" \
            --notes "Automated debug APK built from $TARGET. This is an internal testing artifact, not a signed Play Store release. Verify the attached SHA-256 checksum before installation."
